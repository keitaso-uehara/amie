# amie — Supabase プロジェクト設定（抜粋）
# `supabase init` で生成される config.toml をベースに、本サービスで要点となる箇所を明示。
project_id = "amie"

[db]
major_version = 15

[auth]
# 会員登録・ログイン（S13）: メール＋SNS（Google/LINE/Apple）
site_url = "http://localhost:8788"
additional_redirect_urls = ["http://localhost:8788"]
jwt_expiry = 3600
enable_signup = true
# ローカルデモは匿名サインインで即ログイン（本番はSNS/メールに置換）
enable_anonymous_sign_ins = true

[auth.email]
enable_confirmations = false   # ローカルはメール確認なしで即利用（本番は true）

# SNSログイン（S13）。ローカルでは無効。本番では enabled=true にし、
# client_id / secret を env() 参照で設定する（例: client_id = "env(GOOGLE_CLIENT_ID)"）。
[auth.external.google]
enabled = false
# client_id = "env(GOOGLE_CLIENT_ID)"
# secret = "env(GOOGLE_SECRET)"
[auth.external.apple]
enabled = false
# client_id = "env(APPLE_CLIENT_ID)"
# secret = "env(APPLE_SECRET)"
# LINE は Supabase 標準プロバイダに無いため、OIDC カスタムプロバイダ or 独自実装で対応
# [auth.external.line] は別途 Edge Function 連携で実装

[storage]
# チャットの画像添付（メイク写真・コーデ写真）。センシティブ情報のためバケットは非公開＋署名URL。
enabled = true

[functions.create-order]
verify_jwt = true
[functions.complete-order]
verify_jwt = true
[functions.create-daily-room]
verify_jwt = true
[functions.stripe-webhook]
verify_jwt = false   # Stripe 署名で検証するため JWT は不要
[functions.auto-refund]
verify_jwt = false   # cron から service role で起動
[functions.sns-sync]
verify_jwt = false
